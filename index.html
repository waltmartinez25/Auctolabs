<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="color-scheme" content="dark" />
    <style>html,body{background:#0A0A0A;}</style>
    <!--
      Fallback title only. Every route overrides it via the SEO component.
      A page description is deliberately NOT declared here: the prerenderer
      appends Helmet's tags instead of replacing existing ones, so a static
      one would sit *above* the per-page tag and become the copy crawlers
      actually use for all ten routes.
    -->
    <title>AuctoLabs | Web Design &amp; AI Automations for Small Business Growth</title>
    <meta name="author" content="AuctoLabs" />
    <meta name="keywords" content="web design, AI automations, lead generation, small business, automation, websites, CRM integration" />

    <!-- Non-blocking Google Fonts (eliminates render-blocking @import) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Serif+Display:ital@0;1&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Serif+Display:ital@0;1&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=DM+Serif+Display:ital@0;1&display=swap" /></noscript>

    <!-- Preload the hero's LCP image (stable public/ path, no build hash) -->
    <link rel="preload" as="image" href="/mockups/mock-penn-turf.jpg" />


    
    
    <!--
      og:type and og:image are emitted per page by <SEO>, and the prerenderer
      appends rather than replaces, so declaring them here too shipped each one
      twice. Only tags <SEO> does NOT emit belong in this file.
    -->
    <meta name="twitter:site" content="@AuctoLabs" />
    
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/logo.png">

    <!--
      og:title / og:description / twitter:title / twitter:description are set
      per page by <SEO> (react-helmet-async) and injected at prerender time.
      Do not add them here: the prerenderer appends rather than replaces, and
      crawlers read the first occurrence, so a static copy here wins over the
      real page's tag and every route ends up sharing the homepage's preview.
    -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
